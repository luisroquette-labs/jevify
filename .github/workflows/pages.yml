name: Pages

on:
  push:
    branches: ["feat/jeviphy-fast-source-retrieval-20261018"]
    paths:
      - "docs/jeviphy/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/jeviphy
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
